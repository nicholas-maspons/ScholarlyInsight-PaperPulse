<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Pulse</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js"></script>
</head>

<body>
    <header>
        <h1><a href="/">Paper Pulse</a></h1>

        <div>
            <input type="text" name="search-query" id="search-query" placeholder="Search term...">
            <a class="button" id="search">Search</a>
            <a class="button" id="toggle-filter">Filter</a>
        </div>

        <nav>
            <ul id="nav-links">
                <!-- JS will dynamically inject login/logout buttons here -->
            </ul>
        </nav>
    </header>

    <!-- Login / Signup Form -->
    <div id="auth-container">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button id="login-button">Login</button>
    </div>

    <!-- Advanced Search Filters -->
    <form action="" class="form-container" id="advanced-search">
        <div>
            <label>Find term in:</label><br>
            <label><input type="checkbox" name="prefix" value="ti">Title</label>
            <label><input type="checkbox" name="prefix" value="au">Author</label>
            <label><input type="checkbox" name="prefix" value="abs">Abstract</label>
            <label><input type="checkbox" name="prefix" value="all" id="all-prefix">All</label>
        </div>
    </form>

    <main>
        <div id="results"></div>
    </main>

    <!-- Scripts -->
    <script type="module" src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
